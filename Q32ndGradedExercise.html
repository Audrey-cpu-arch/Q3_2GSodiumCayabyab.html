<!DOCTYPE html>
<html>
    <head>

 <link rel="stylesheet" type="text/css" href="Q32ndGradedExercise.css">
    </head>
    <body>
     
        

        <form method = "post"   onsubmit = "submitform()"onreset = "resetform()" > 
          
            
<h1> Student Information Form</h1>


            
                <fieldset>
                    <legend> Student Id</legend>
             <label for = 'studentid'> student id: </label>
           <input id = "studentid" type = "number" required>
           
        </fieldset>


            
                <fieldset>
                    <legend> Student Name</legend>
            <label for = 'fullname'> student full name: </label>
            <input id = "fullname" type = "text" required>
        </fieldset>
            

<fieldset>
    <legend> Student Birthday </legend>
 <label for = 'birthday'> birthday: </label>
<input id = "birthday" type = "date" required>
</fieldset>


<fieldset>
    <legend> Student Digital Info</legend>


 <label for = 'emailaddress'> email address: </label>
        <input id = "emailaddress" type = "email" required>
<br><br>
         <label for = 'mobilephone'> phone number: </label>
        <input id = "mobilephone" type = "text" required>

</fieldset>



    <fieldset>
        <legend> Student Grade Level </legend>
 <label for = 'Grade Level'> student grade level: </label>

        <select id = "gradelevel" required>
            <option value = "seventhgrade"> 7 </option>
            <option value = "eighthgrade"> 8 </option>
            <option value = "ninthgrade"> 9 </option>
            <option value = "tenthgrade"> 10 </option>
            <option value = "eleventhgrade"> 11 </option>
            <option value = "twelfthgrade"> 12 </option>
        </select>
    </fieldset>

    <fieldset>
        <legend> Student Info </legend>
         <label for = 'Intern / Extern' required> intern or extern: </label>
         <br>
       
        <input type = "radio" id="intern" name = "name">
        <label for="intern">Intern</label>
        <input type = "radio" id="extern" name = "name">
        <label for="extern">Extern</label>
        </fieldset>




    <fieldset>
        <legend> Studen Preference</legend>
        <label for = 'Preferred Organization / Club'> preferred organization / club: </label>
       <select id = 'Preferred Organization / Club' required>
            <option value = "christian"> ACTS </option>
            <option value = "firsbee"> ALIANTI </option>
            <option value = "astronomy"> ASTROSOC </option>
            <option value = "chemistry"> ATOM </option>
            <option value = "photography"> EXPOSURE </option>

            
        </select>
    </fieldset>


    <fieldset>
        <legend> Student Reasons</legend>

         <label for = 'reason'> reason(s) for joining: </label>
         <br>
        <textarea  id = "reasonsforjoining" rows = "4" cols = "100"> </textarea>

    </fieldset>



  
<div>       
<input type="submit" id = "submitbutton" value = "submit form" onclick="alert('Are you sure you want to submit the form?')">
</div>

<div>    
<input type="reset" value = "reset form" onclick="alert('Are you sure you want to reset the form?')">
</div>

<div>
    <button onclick = "submitform()" id = "viewSignupsButton"> View Signups </button>
</div>
</form>

<script>
    const id = document.getElementById("studentid").value;
    JSON.stringify(id);
    localStorage.setItem("student's id", id);

    const fullname = document.getElementById("fullname").value;
    JSON.stringify(fullname);
    localStorage.setItem("student's full name", fullname);

    const birthday = document.getElementById("birthday").value;
    JSON.stringify(birthday);
    localStorage.setItem("student's birthday", birthday);

    const email = document.getElementById("emailaddress").value;
    JSON.stringify(email);
    localStorage.setItem("student's email", email);

    const gradelevel = document.getElementById("gradelevel").value;
    JSON.stringify(gradelevel);
    localStorage.setItem("student's grade level", gradelevel);

    const organization = document.getElementById("Preferred Organization / Club").value;
    JSON.stringify(organization);
    localStorage.setItem("student's organization", organization);

    const reason = document.getElementById("reasonsforjoining").value;
    JSON.stringify(reason);
    localStorage.setItem("student's reasons", reason);

    

    
function resetform(){
    alert("The form has been resetted.");
}

function viewsignups(){
    window.open("viewSignUps.html", _blank);
}

function submitform(){
    
    if(document.getElementById('submitbutton').clicked == true){
        document.getElementById("form").submit();
    alert("The form has been submitted.");


    }

else if(document.getElementById('viewSignupsButton').clicked == true){
return false;
 viewsignups()
}
}   


   


//textfield use .innerHTML
//the actual input it is .value
</script>
    </body>
</html>
